<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Tracking Photos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://www.17track.net/externalcall.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            }

            try {
                // Try fetching from GitHub directly for latest data
                const repo = 'ezyship/track';
                const branch = 'main';
                let res = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/records.json?v=` + Date.now());
                let loaded = false;
                let freshRecords = [];

                if (!res.ok) {
                    // Fallback to local if GitHub fails
                    res = await fetch('records.json?v=' + Date.now());
                if (firebaseDb) {
                    try {
                        const snapshot = await firebaseDb.ref('records').once('value');
                        const val = snapshot.val();
                        if (val) {
                            freshRecords = Array.isArray(val) ? val : Object.values(val);
                        }
                        freshRecords = freshRecords.filter(r => r !== null && r !== undefined);
                        loaded = true;
                    } catch (e) {
                        console.error("Firebase DB read failed:", e);
                    }
                }

                if (!res.ok) throw new Error('Tracking records not found on GitHub or locally.');
                const text = await res.text();
                const freshRecords = text.trim() ? JSON.parse(text) : [];
                if (!loaded) {
                    // Try fetching from GitHub directly for latest data
                    const repo = 'ezyship/track';
                    const branch = 'main';
                    let res = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/records.json?v=` + Date.now());

                    if (!res.ok) {
                        // Fallback to local if GitHub fails
                        res = await fetch('records.json?v=' + Date.now());
                    }

                    if (!res.ok) throw new Error('Tracking records not found on GitHub or locally.');
                    const text = await res.text();
                    freshRecords = text.trim() ? JSON.parse(text) : [];
                }

                // Save to cache
                localStorage.setItem('ghRecordsCache', JSON.stringify(freshRecords));
                allRecords = freshRecords;

                // Update UI state if it was loading, or just refresh search if input is active
                const q = document.getElementById('si').value.trim();
                const isLoadingShown = document.getElementById('load-st').style.display !== 'none';
                if (isLoadingShown || q.length >= 5) {
                    showState('init-st');
                    if (q.length >= 5) doSearch();
                }
            } catch (e) {
                if (!allRecords.length) {
                    showState('norec-st');
                    document.getElementById('norec-st').querySelector('p').textContent = e.message;
                } else {
                    console.warn("Background refresh failed, using cached records:", e);
                }
            }
        }

        function hl(text, q) {
            if (text === undefined || text === null) return '';
            if (!q) return text;
            return String(text).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
        }
        function fmtDate(iso) {
            if (!iso) return '';
            const d = new Date(iso); if (isNaN(d)) return iso;
            const p = n => String(n).padStart(2, '0');
            return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function doSearch() {
            const raw = document.getElementById('si').value.trim();
            const q = raw.toLowerCase();
            if (!allRecords.length) { showState('norec-st'); return; }

            // Require exactly/at least 5 characters for security
            if (q.length < 5) { showState('init-st'); return; }

            const matched = allRecords.filter(r =>
                String(r.phone || '').endsWith(q)
            );

            ['init-st', 'empty-st', 'norec-st', 'load-st'].forEach(s => document.getElementById(s).style.display = 'none');

            if (!matched.length) { document.getElementById('empty-st').style.display = 'block'; document.getElementById('rstats').style.display = 'none'; document.getElementById('rgrid').innerHTML = ''; return; }

            document.getElementById('rstats').style.display = 'flex';
            document.getElementById('rcnt').textContent = matched.length;
            document.getElementById('rbadge').textContent = matched.length;

            document.getElementById('rgrid').innerHTML = matched.map(r => {
                return `
    <div class="rc" onclick="openMod('${r.id}')">
      <div class="vo"><span>🔍 View Photo</span></div>
      <img src="${r.photoUrl}" alt="parcel photo" loading="lazy">
      <div class="ci">
        <div class="cn">👤 ${hl(r.name, q)}</div>
        <div class="ml">
          <span class="chip">📍 ${hl(r.pincode, q)}</span>
          <span class="chip ph">📞 ${hl(r.phone, q)}</span>
          ${r.awb ? `<span class="chip" style="background:rgba(16,185,129,0.1); border-color:rgba(16,185,129,0.2); color:#34d399;">🚚 ${hl(r.awb, q)}</span>` : ''}
          <span class="chip dt">🕐 ${fmtDate(r.uploadedAt)}</span>
        </div>
      </div>
    </div>`;
            }).join('');
        }

        function openMod(id) {
            const r = allRecords.find(x => x.id === id);
            if (!r) return;
            document.getElementById('mimg').src = r.photoUrl;
            document.getElementById('mname').textContent = `👤 ${r.name}`;
            document.getElementById('mmeta').innerHTML = `
        <span class="chip">📍 ${r.pincode}</span>
        <span class="chip ph">📞 ${r.phone}</span>
        ${r.awb ? `<span class="chip" style="background:rgba(16,185,129,0.1); border-color:rgba(16,185,129,0.2); color:#34d399;">🚚 ${r.awb}</span>` : ''}
        <span class="chip dt">🕐 ${fmtDate(r.uploadedAt)}</span>
      `;

            // Setup Tracking Area
            const actionArea = document.getElementById('tracking-action-area');
            const manualBox = document.getElementById('manual-track-box');
            actionArea.innerHTML = '';

            if (r.awb) {
                manualBox.style.display = 'none';
                actionArea.innerHTML = `
          <a href="livestatus.html?awb=${encodeURIComponent(r.awb)}" class="dlbtn" style="width:100%; max-width:500px; justify-content:center; background:linear-gradient(135deg, #10b981, #059669); border:none; font-size:1.1rem; padding:18px; border-radius:15px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); transition: transform 0.2s;">🚀 Click to Track Status</a>
          <a href="${r.photoUrl}" class="dl-btn-secondary" style="margin-top:5px;" download="tracking_photo_${r.id}.jpg">⬇️ Download Photo</a>
        `;
            } else {
                manualBox.style.display = 'block';
                document.getElementById('manual-awb').value = '';
                actionArea.innerHTML = `
          <a href="${r.photoUrl}" class="dl-btn-secondary" download="tracking_photo_${r.id}.jpg">⬇️ Download Photo</a>
        `;
            }

            document.getElementById('imod').classList.add('open');
        }

        function startManualTrack() {
            const num = document.getElementById('manual-awb').value.trim();
            if (!num) { alert("Please enter the tracking ID from the photo."); return; }
            window.location.href = `livestatus.html?awb=${encodeURIComponent(num)}`;
        }

        function closeMod() { document.getElementById('imod').classList.remove('open'); document.getElementById('mimg').src = ''; }

        document.getElementById('imod').addEventListener('click', e => { if (e.target === document.getElementById('imod')) closeMod(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMod(); } });

        // Init
        loadAndSearch();
    </script>
</body>

</html
